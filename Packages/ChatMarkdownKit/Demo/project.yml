name: ChatMarkdownDemo
options:
  bundleIdPrefix: net.bopp
  deploymentTarget:
    iOS: "16.0"
packages:
  ChatMarkdownKit:
    path: ..
targets:
  ChatMarkdownDemo:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    dependencies:
      - package: ChatMarkdownKit
        product: ChatMarkdownKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.bopp.ChatMarkdownDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 68Z6A6ACWF
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_VERSION: "6.0"
    scheme:
      configVariants: []
